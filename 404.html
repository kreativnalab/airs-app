<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AIRS — Redirecting...</title>
  <script>
    // GitHub Pages SPA routing trick.
    // Saves the full path into sessionStorage, then redirects to root.
    // app.js picks this up and routes to the correct page.
    var path = window.location.pathname + window.location.search;
    sessionStorage.setItem('airs-redirect', path);
    window.location.replace('/');
  </script>
</head>
<body></body>
</html>
